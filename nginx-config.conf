server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    # HTTP 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL 证书配置
    # Docker 部署时，建议将证书文件放到 ./ssl/ 目录，并在 docker-compose.yml 中添加 volume 挂载：
    #   - ./ssl/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
    #   - ./ssl/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 前端静态资源（dist 目录）
    # Docker 部署时，前端文件挂载在 /usr/share/nginx/html（见 docker-compose.yml volumes）
    # 非 Docker 部署时，修改为实际 dist 目录路径
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端（带版本 /api/v1）
    # 后端 server.servlet.context-path = /api/v1
    #
    # Docker 部署时：proxy_pass http://star-pivot:8080/api/v1/;
    # 非 Docker 部署时：proxy_pass http://127.0.0.1:8080/api/v1/;
    location /api/v1/ {
        proxy_pass http://star-pivot:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 向后兼容：老客户端调用 /api/xxx 时 308 永久重定向到 /api/v1/xxx
    # 若无需兼容，可删除此 location 块
    location ~ ^/api/(.*)$ {
        return 308 /api/v1/$1;
    }

    # Actuator 监控端点（独立基础路径，便于网关/运维加白名单）
    location /actuator/ {
        proxy_pass http://star-pivot:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

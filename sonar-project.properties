# ============================================
# SonarQube 项目配置
# ============================================
# 使用方式（本地 SonarQube）:
#   mvn clean verify sonar:sonar -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<your-token>
# 或在 GitHub Actions 中自动运行（见 .github/workflows/sonarqube.yml）

# 项目基本信息
sonar.projectKey=star-pivot
sonar.projectName=StarPivot
sonar.projectVersion=0.0.1-SNAPSHOT

# 源码编码
sonar.sourceEncoding=UTF-8

# Java 版本
sonar.java.source=17

# 源码与测试目录（Maven 多模块自动识别，此处做补充声明）
sonar.sources=src/main/java
sonar.tests=src/test/java

# JaCoCo 覆盖率报告路径（各子模块相对路径）
sonar.coverage.jacoco.xmlReportPaths=\
  star-pivot-controller/target/site/jacoco/jacoco.xml,\
  star-pivot-framework/star-pivot-framework-core/target/site/jacoco/jacoco.xml,\
  star-pivot-framework/star-pivot-framework-boot-starter/target/site/jacoco/jacoco.xml,\
  star-pivot-framework/star-pivot-framework-datasource/target/site/jacoco/jacoco.xml,\
  star-pivot-framework/star-pivot-framework-file/target/site/jacoco/jacoco.xml,\
  star-pivot-framework/star-pivot-framework-log/target/site/jacoco/jacoco.xml,\
  star-pivot-framework/star-pivot-framework-web/target/site/jacoco/jacoco.xml,\
  star-pivot-framework/star-pivot-security/target/site/jacoco/jacoco.xml,\
  star-pivot-module/star-pivot-system/target/site/jacoco/jacoco.xml,\
  star-pivot-module/star-pivot-dict/target/site/jacoco/jacoco.xml,\
  star-pivot-module/star-pivot-generator/target/site/jacoco/jacoco.xml,\
  star-pivot-module/star-pivot-mall/target/site/jacoco/jacoco.xml,\
  star-pivot-module/star-pivot-monitor/target/site/jacoco/jacoco.xml,\
  star-pivot-module/star-pivot-quartz/target/site/jacoco/jacoco.xml,\
  star-pivot-module/star-pivot-workflow/target/site/jacoco/jacoco.xml

# 排除不需要分析的文件
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/logs/**,\
  **/sql/**,\
  **/doc/**,\
  **/*.xml,\
  **/*.sql,\
  **/*.md,\
  **/*.json,\
  **/*.yml,\
  **/*.yaml,\
  **/star-pivot-ui/**

# 测试排除（避免将非测试代码误识别为测试）
sonar.test.exclusions=\
  **/test/**

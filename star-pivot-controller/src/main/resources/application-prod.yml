# =============================================================================
# 生产环境：spring.profiles.active=prod
#
# 必填环境变量：
#   DB_URL / DB_USERNAME / DB_PASSWORD
#   REDIS_HOST
#   JWT_SECRET
#   CORS_ALLOWED_ORIGINS   前端访问源，多个用逗号分隔，不可为 *
#
# 可选：REDIS_PORT / REDIS_PASSWORD / JWT_PREVIOUS_SECRET / OSS_* 等
# AI（启用对话/RAG 时必填）：AI_API_KEY；RAG 向量需 AI_EMBEDDING_API_KEY；重排序可选 AI_RERANKER_API_KEY
# =============================================================================

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    druid:
      # 生产环境关闭 Druid 控制台与 Web 统计，避免暴露 SQL 监控面
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
      use-global-data-source-stat: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5000ms}

jwt:
  secret: ${JWT_SECRET}
  previous-secret: ${JWT_PREVIOUS_SECRET:}
  expiration: ${JWT_EXPIRATION:7200000}

# 明确前端域名白名单；未设置时启动失败，防止回落为 *
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

security:
  swagger-permit-all: false

# 关闭 OpenAPI / Knife4j / Swagger UI
knife4j:
  enable: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 与 @ConditionalOnProperty(prefix = "druid.monitor") 配合，禁用 Druid 重定向等开发向组件
druid:
  monitor:
    enabled: false

oss:
  endpoint: ${OSS_ENDPOINT:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:star-pivot}
  url-prefix: ${OSS_URL_PREFIX:}

logging:
  level:
    root: info
    com.star.pivot: info
    org.springframework.security: warn
    org.apache.ibatis: warn

management:
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: true

# 外部库代码生成（生产 ECS：仅 ZIP 下载，禁止服务端写盘）
gen:
  external:
    enabled: true
    write-to-disk-enabled: false
    allowed-hosts:
      - 127.0.0.1
      - localhost
    session-ttl-minutes: 15
    max-tables-per-download: 10
---
# -----------------------------------------------------------------------------
# AI 智能对话（Spring AI + RAG）
# 密钥通过环境变量注入：AI_API_KEY、AI_EMBEDDING_API_KEY、AI_RERANKER_API_KEY
# RAG 双开关：star-pivot.ai.rag.enabled=true + 库表 ai_config.rag_enabled=0
# -----------------------------------------------------------------------------
spring:
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.7
          max-tokens: 4096
      embedding:
        base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        api-key: ${AI_EMBEDDING_API_KEY:}
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
          dimensions: 1024

star-pivot:
  ai:
    bot-name: ${AI_BOT_NAME:AI 助手}
    bot-avatar: ${AI_BOT_AVATAR:}
    default-model: ${AI_MODEL:deepseek-chat}
    default-temperature: 0.7
    default-prompt-scene: default
    max-memory-messages: 30
    welcome-message: ${AI_WELCOME_MESSAGE:你好！我是 **{botName}**，可以帮你写作、翻译、编程、分析等各类问题，有什么我可以帮你的吗？}
    system-prompt: |
      你是一个智能 AI 助手，能够进行自然、流畅的多轮对话。
      你可以帮助用户完成写作、翻译、编程、分析、头脑风暴、学习辅导等广泛任务。
      请根据用户问题选择合适的方式回答；不确定时请诚实说明，不要编造。
    prompt-templates:
      - id: default
        label: 通用助手
        description: 日常问答、写作、翻译与通用任务
        prompt: |
          你是 {botName}，StarPivot 平台的通用 AI 助手，语气自然、表达清晰。
      - id: support
        label: 客服问答
        description: 产品使用、操作指引与常见问题
        temperature: 0.3
        prompt: |
          你是 {botName}，StarPivot 平台的客服助手，语气礼貌、专业、耐心。
          优先依据参考资料回答产品问题；不要编造系统中不存在的功能或政策。
      - id: developer
        label: 开发辅助
        description: 编程、调试、架构与代码审查
        temperature: 0.2
        model: deepseek-reasoner
        prompt: |
          你是 {botName}，StarPivot 平台的开发助手，熟悉 Java 17、Spring Boot 3、Vue 3、MySQL、Redis。
          涉及安全、性能、并发时主动提醒风险；不要臆造类名、配置项或 API 路径。
      - id: analyst
        label: 数据分析
        description: 报表解读、指标分析与业务洞察
        temperature: 0.4
        prompt: |
          你是 {botName}，StarPivot 平台的数据分析助手，善于解读指标与发现业务洞察。
          缺少数据时不虚构数字，说明需要哪些字段或口径定义。
    models:
      - id: deepseek-chat
        label: DeepSeek Chat
      - id: deepseek-reasoner
        label: DeepSeek Reasoner
    rag:
      enabled: true
      vector-top-k: 20
      fulltext-top-k: 20
      retrieve-top-k: 10
      min-vector-score: 0.3
      vector-scan-batch-size: 2000
      vector-scan-max-chunks: 0
      embedding-cache-ttl: 7d
      hyde-enabled: true
      reranker:
        enabled: true
        endpoint: ${AI_RERANKER_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
        api-key: ${AI_RERANKER_API_KEY:}
        model: ${AI_RERANKER_MODEL:gte-rerank}
        timeout-ms: 1500
    rate-limit:
      enabled: true
      max-requests-per-minute: 20
    query-router:
      enabled: true
      chat-model: deepseek-chat
      reasoner-model: deepseek-reasoner

logging:
  level:
    com.star.pivot.ai: warn


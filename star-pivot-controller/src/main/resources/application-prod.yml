# =============================================================================
# 生产环境：spring.profiles.active=prod
#
# 必填环境变量：
#   DB_URL / DB_USERNAME / DB_PASSWORD
#   REDIS_HOST
#   JWT_SECRET
#   CORS_ALLOWED_ORIGINS   前端访问源，多个用逗号分隔，不可为 *
#
# 可选：REDIS_PORT / REDIS_PASSWORD / JWT_PREVIOUS_SECRET / OSS_* 等
# =============================================================================

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    druid:
      # 生产环境关闭 Druid 控制台与 Web 统计，避免暴露 SQL 监控面
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
      use-global-data-source-stat: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5000ms}

jwt:
  secret: ${JWT_SECRET}
  previous-secret: ${JWT_PREVIOUS_SECRET:}
  expiration: ${JWT_EXPIRATION:7200000}

# 明确前端域名白名单；未设置时启动失败，防止回落为 *
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

security:
  swagger-permit-all: false

# 关闭 OpenAPI / Swagger UI
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 与 @ConditionalOnProperty(prefix = "druid.monitor") 配合，禁用 Druid 重定向等开发向组件
druid:
  monitor:
    enabled: false

oss:
  endpoint: ${OSS_ENDPOINT:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:star-pivot}
  url-prefix: ${OSS_URL_PREFIX:}

logging:
  level:
    root: info
    com.star.pivot: info
    org.springframework.security: warn
    org.apache.ibatis: warn

management:
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: true

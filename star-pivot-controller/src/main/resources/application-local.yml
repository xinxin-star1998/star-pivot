# =============================================================================
# 本地环境：spring.profiles.active=local
# AI 密钥请通过环境变量注入：AI_API_KEY、AI_EMBEDDING_API_KEY、AI_RERANKER_API_KEY
# =============================================================================
# 启动优化：懒加载、减小连接池、缩短超时，加快本地启动
spring:
  main:
    lazy-initialization: true  # 开发环境懒加载 Bean，显著缩短启动时间（首请求略慢）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/star-pivot?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&connectTimeout=10000&socketTimeout=30000}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    druid:
      initial-size: 0
      min-idle: 2
      max-active: 10
      max-wait: 10000
      async-init: true
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 180000
      validation-query: SELECT 1
      validation-query-timeout: 10
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: false
      max-pool-prepared-statement-per-connection-size: -1
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=2000
      use-global-data-source-stat: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5000ms}

mybatis-plus:
  configuration:
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}

jwt:
  secret: ${JWT_SECRET:Dj4G8272xJONkOqkn1pM8q1n+U5MPLrRUCjXun3/Yeo=}
  previous-secret: ${JWT_PREVIOUS_SECRET:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    com.star.pivot: ${LOG_LEVEL:debug}
    org.springframework.security: ${SECURITY_LOG_LEVEL:debug}
    org.apache.ibatis: ${SQL_LOG_LEVEL:DEBUG}

# -----------------------------------------------------------------------------
# 文件存储：本地开发环境使用 OSS
# -----------------------------------------------------------------------------

# 本地环境：默认关闭 Redis 健康检查，避免未启动 Redis 时反复报 WARN
# 启动 Redis 后可将 REDIS_HEALTH_ENABLED=true 或改为 true
management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

# -----------------------------------------------------------------------------
# 外部库代码生成：本地写盘默认路径（可按本机项目修改或通过环境变量覆盖）
# -----------------------------------------------------------------------------
gen:
  external:
    default-output-root: ${GEN_EXTERNAL_OUTPUT_ROOT:E:/star-pivot/project0422/StarPivot}
    allowed-write-paths:
      - ${GEN_EXTERNAL_OUTPUT_ROOT:E:/star-pivot/project0422/StarPivot}
    backup-before-write: true
---
# -----------------------------------------------------------------------------
# AI 智能对话（Spring AI + RAG）
# 密钥通过环境变量注入：AI_API_KEY、AI_EMBEDDING_API_KEY、AI_RERANKER_API_KEY
# RAG 双开关：star-pivot.ai.rag.enabled=true + 库表 ai_config.rag_enabled=0
# -----------------------------------------------------------------------------
spring:
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.7
          max-tokens: 4096
      embedding:
        base-url: ${AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        api-key: ${AI_EMBEDDING_API_KEY:}
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
          dimensions: 1024

star-pivot:
  ai:
    bot-name: ${AI_BOT_NAME:AI 助手}
    bot-avatar: ${AI_BOT_AVATAR:}
    default-model: ${AI_MODEL:deepseek-chat}
    default-temperature: 0.7
    default-prompt-scene: default
    max-memory-messages: 30
    welcome-message: ${AI_WELCOME_MESSAGE:你好！我是 **{botName}**，可以帮你写作、翻译、编程、分析等各类问题，有什么我可以帮你的吗？}
    system-prompt: |
      你是一个智能 AI 助手，能够进行自然、流畅的多轮对话。
      你可以帮助用户完成写作、翻译、编程、分析、头脑风暴、学习辅导等广泛任务。
      请根据用户问题选择合适的方式回答；不确定时请诚实说明，不要编造。
    prompt-templates:
      - id: default
        label: 通用助手
        description: 日常问答、写作、翻译与通用任务
        prompt: |
          你是 {botName}，StarPivot 平台的通用 AI 助手，语气自然、表达清晰。
      - id: support
        label: 客服问答
        description: 产品使用、操作指引与常见问题
        temperature: 0.3
        prompt: |
          你是 {botName}，StarPivot 平台的客服助手，语气礼貌、专业、耐心。
          优先依据参考资料回答产品问题；不要编造系统中不存在的功能或政策。
      - id: developer
        label: 开发辅助
        description: 编程、调试、架构与代码审查
        temperature: 0.2
        model: deepseek-reasoner
        prompt: |
          你是 {botName}，StarPivot 平台的开发助手，熟悉 Java 17、Spring Boot 3、Vue 3、MySQL、Redis。
          涉及安全、性能、并发时主动提醒风险；不要臆造类名、配置项或 API 路径。
      - id: analyst
        label: 数据分析
        description: 报表解读、指标分析与业务洞察
        temperature: 0.4
        prompt: |
          你是 {botName}，StarPivot 平台的数据分析助手，善于解读指标与发现业务洞察。
          缺少数据时不虚构数字，说明需要哪些字段或口径定义。
    models:
      - id: deepseek-chat
        label: DeepSeek Chat
      - id: deepseek-reasoner
        label: DeepSeek Reasoner
    rag:
      enabled: true
      vector-top-k: 20
      fulltext-top-k: 20
      retrieve-top-k: 10
      min-vector-score: 0.3
      vector-scan-batch-size: 2000
      vector-scan-max-chunks: 0
      embedding-cache-ttl: 7d
      hyde-enabled: true
      reranker:
        enabled: true
        endpoint: ${AI_RERANKER_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
        api-key: ${AI_RERANKER_API_KEY:}
        model: ${AI_RERANKER_MODEL:gte-rerank}
        timeout-ms: 1500
    rate-limit:
      enabled: true
      max-requests-per-minute: 30
    query-router:
      enabled: true
      chat-model: deepseek-chat
      reasoner-model: deepseek-reasoner

logging:
  level:
    com.star.pivot.ai: INFO


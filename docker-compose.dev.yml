version: '3.8'

# 开发环境配置（覆盖生产配置）
# 使用方式：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# 如需 Adminer 数据库管理工具，追加：--profile dev-tools up -d adminer
services:
  star-pivot:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DEBUG_MODE: "true"
    volumes:
      # 挂载源代码用于热重载（如果使用 DevTools）
      - ./star-pivot-controller/src:/app/src
      - app-logs:/app/logs
    ports:
      - "8080:8080"
      - "5005:5005"  # 调试端口（IDE Remote Debug → localhost:5005）

  # 开发用 Adminer（轻量级数据库管理工具）
  # 启动：docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile dev-tools up -d adminer
  # 访问：http://localhost:8081
  # 登录：服务器=mysql / 用户名=starpivot / 密码见 .env MYSQL_PASSWORD
  adminer:
    image: adminer:latest
    container_name: star-pivot-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    networks:
      - star-pivot-network
    profiles:
      - dev-tools

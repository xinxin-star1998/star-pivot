# ============================================
# 后端构建与测试 CI
# ============================================
# 触发条件：push/PR 到 main/develop，或手动触发
# 功能：编译 Java 后端 → 运行单元测试 → 生成 JaCoCo 覆盖率报告 → 上传构建产物
name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - '**.java'
      - '**/pom.xml'
      - 'star-pivot-*/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '**.java'
      - '**/pom.xml'
      - 'star-pivot-*/**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: star_pivot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install BOM first
        run: mvn install -f star-pivot-dependencies/pom.xml -B

      - name: Build & Run Tests
        run: mvn clean verify -B
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/star_pivot_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123456

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          retention-days: 7

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-jar
          path: star-pivot-controller/target/*.jar
          retention-days: 7

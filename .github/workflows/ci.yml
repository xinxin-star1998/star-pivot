name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend (compile + tests + ArchUnit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install BOM
        run: mvn -B install -f star-pivot-dependencies/pom.xml -DskipTests

      - name: Compile and test
        run: mvn -B test

  frontend:
    name: Frontend (vue-tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: star-pivot-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: star-pivot-ui/pnpm-lock.yaml

      - name: Install dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate auto-import types
        run: |
          pnpm exec vite --mode development --host 127.0.0.1 --port 5173 &
          VITE_PID=$!
          for i in $(seq 1 60); do
            if [ -f src/types/import/auto-imports.d.ts ] && [ -f src/types/import/components.d.ts ]; then
              break
            fi
            sleep 1
          done
          kill $VITE_PID 2>/dev/null || true
          wait $VITE_PID 2>/dev/null || true
          test -f src/types/import/auto-imports.d.ts
          test -f src/types/import/components.d.ts

      - name: Type check
        run: pnpm exec vue-tsc --noEmit

      - name: Build
        run: pnpm build

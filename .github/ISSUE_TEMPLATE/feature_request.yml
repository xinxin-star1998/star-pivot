name: 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议！请先说明使用场景，便于评估优先级。

  - type: textarea
    id: problem
    attributes:
      label: 问题 / 场景
      description: 你遇到了什么问题，或希望在什么场景下使用？
      placeholder: 例如：希望支持按部门批量导入用户
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你期望的功能或交互方式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式？

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 后端 API
        - 前端页面
        - 数据库结构
        - 文档 / 部署
        - 全栈
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级（自评）
      options:
        - 高（阻塞使用）
        - 中（有明显收益）
        - 低（锦上添花）
    validations:
      required: true

  - type: checkboxes
    id: willingness
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现此功能
          required: false
        - label: 我可以协助测试
          required: false

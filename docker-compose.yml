version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: star-pivot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-star-pivot}
      MYSQL_USER: ${MYSQL_USER:-starpivot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-starpivot123}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    networks:
      - star-pivot-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: star-pivot-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis123}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    networks:
      - star-pivot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # StarPivot 应用
  star-pivot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: star-pivot-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # --- 数据源（application-prod.yml / application-dev.yml 使用 DB_URL 等变量） ---
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-star-pivot}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-starpivot}
      DB_PASSWORD: ${MYSQL_PASSWORD:-starpivot123}
      # --- Redis（application-prod.yml / application-dev.yml 使用 REDIS_HOST 等变量） ---
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # --- 安全 ---
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production-min-32-bytes}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # --- OSS ---
      OSS_ENABLED: ${OSS_ENABLED:-false}
      # --- 时区 ---
      TZ: Asia/Shanghai
      # --- Flyway 数据库迁移 ---
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-logs:/app/logs
      - app-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - star-pivot-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start-period: 60s

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: star-pivot-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx-config.conf:/etc/nginx/conf.d/default.conf:ro
      - ./star-pivot-ui/dist:/usr/share/nginx/html:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - star-pivot
    networks:
      - star-pivot-network
    profiles:
      - with-nginx

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  app-logs:
    driver: local
  app-data:
    driver: local
  nginx-logs:
    driver: local

networks:
  star-pivot-network:
    driver: bridge
